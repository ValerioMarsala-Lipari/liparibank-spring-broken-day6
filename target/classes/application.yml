spring:
  application:
    name: liparibank-day06

  datasource:
    url: jdbc:h2:mem:liparibankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    com.lipari.bank: DEBUG

liparibank:
  jwt:
    secret: ${JWT_SECRET:liparibank-development-secret-key-256}